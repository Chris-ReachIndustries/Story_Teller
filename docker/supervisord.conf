[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[program:backend]
command=/app/backend/server
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="%(ENV_PORT)s",CARDS_PATH="%(ENV_CARDS_PATH)s",NEXTJS_URL="%(ENV_NEXTJS_URL)s",MIN_PLAYERS="%(ENV_MIN_PLAYERS)s",AI_ENABLED="%(ENV_AI_ENABLED)s",AI_PROVIDER="%(ENV_AI_PROVIDER)s",OPENAI_API_KEY="%(ENV_OPENAI_API_KEY)s",LOCAL_AI_URL="%(ENV_LOCAL_AI_URL)s",AI_MODEL="%(ENV_AI_MODEL)s",AI_TIMEOUT_MS="%(ENV_AI_TIMEOUT_MS)s",AI_MAX_TOKENS="%(ENV_AI_MAX_TOKENS)s",AI_TEMPERATURE="%(ENV_AI_TEMPERATURE)s",AI_THUMB_WIDTH="%(ENV_AI_THUMB_WIDTH)s"

[program:frontend]
command=node /app/frontend/.next/standalone/server.js
directory=/app/frontend/.next/standalone
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PORT="3000",HOSTNAME="0.0.0.0"
